name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}-p4a-develop-python310-v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk wget \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev build-essential ccache libltdl-dev

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install Cython==0.29.36 buildozer==1.5.0

      - name: Build APK with Buildozer
        run: buildozer -v android debug

      - name: Verify APK was created
        if: success()
        run: |
          test -n "$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)" || {
            echo 'Build succeeded but no APK was found in bin/'
            exit 1
          }
          ls -lh bin/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: barcodescanner-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload build logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs
          path: |
            .buildozer/
            *.log
          if-no-files-found: warn
